<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrossel de Imagens</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:white;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.carousel-container{
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;
    background:white;
}

.carousel{
    display:flex;
    width:100%;
    height:100%;
    transition:transform 0.8s ease-in-out;
}

.slide{
    min-width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:white;
    padding:10px;
}

.slide img{
    width:100%;
    max-height:100%;
    object-fit:contain;
    background:white;
}

.caption{
    width:100%;
    padding:10px;
    text-align:center;
    font-size:12px;
    color:black;
    background:white;
    line-height:1.4;
}
</style>
</head>

<body>

<div class="carousel-container">
    <div class="carousel" id="carousel">

        <div class="slide">
    <img src="BanerEst.png" alt="">
    <div class="caption">
        É só clicar em Treinar Palavras
    </div>
</div>

        
        <div class="slide">
            <img src="BanToalha.png" alt="">
            <div class="caption">
                Pra que pagar se você pode ter de graça.
            </div>
        </div>

        
        <div class="slide">
            <img src="TesteBanner3-3.jpg" alt="">
            <div class="caption">
                Recursos Completos sem Limite.
            </div>
        </div>

       
        <div class="slide">
            <img src="TrePa.jpg" alt="">
            <div class="caption">
                Treine todos os dias 30 palavras.
            </div>
    </div>
</div>

<script>
const carousel = document.getElementById('carousel');
const slides = document.querySelectorAll('.slide');

let index = 0;

setInterval(() => {
    index++;

    if(index >= slides.length){
        index = 0;
    }

    carousel.style.transform =
        `translateX(-${index * 100}%)`;

}, 4000);
</script>

</body>
</html>
