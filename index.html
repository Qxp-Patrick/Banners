<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrossel de Imagens</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#CFFFF4EC;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.carousel-container{
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;
}

.carousel{
    display:flex;
    width:100%;
    height:100%;
    transition:transform 0.8s ease-in-out;
}

.slide{
    min-width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.slide img{
    width:100%;
    max-height:75%;
    object-fit:contain;
    border-radius:12px;
}

.caption{
    margin-top:15px;
    font-size:24px;
    color:black;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="carousel-container">
    <div class="carousel" id="carousel">

        <!-- IMAGEM 1 -->
        <div class="slide">
            <img src="imagens/foto1.jpg" alt="">
            <div class="caption">
                Esta é a legenda da primeira imagem
            </div>
        </div>

        <!-- IMAGEM 2 -->
        <div class="slide">
            <img src="imagens/foto2.jpg" alt="">
            <div class="caption">
                Segunda legenda aqui
            </div>
        </div>

        <!-- IMAGEM 3 -->
        <div class="slide">
            <img src="imagens/foto3.jpg" alt="">
            <div class="caption">
                Terceira legenda aqui
            </div>
        </div>

    </div>
</div>

<script>
const carousel = document.getElementById('carousel');
const slides = document.querySelectorAll('.slide');

let index = 0;

setInterval(() => {
    index++;

    if(index >= slides.length){
        index = 0;
    }

    carousel.style.transform =
        `translateX(-${index * 100}%)`;

}, 4000);
</script>

</body>
</html>
